<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <!-- 引入样式 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="logo">个人主页</div>
        <div class="nav-menu">
            <a href="#home">首页</a>
            <a href="#about">关于我</a>
            <a href="#project">项目</a>
            <a href="#contact">联系我</a>
        </div>
    </nav>

    <!-- 首页横幅 -->
    <section id="home" class="hero">
        <div class="hero-text">
            <h1>你好，我是开发者</h1>
            <p>前端 / 编程爱好者 | GitHub 个人站点</p>
            <button id="changeTextBtn">点我切换文字</button>
        </div>
    </section>

    <!-- 关于我 -->
    <section id="about" class="section">
        <h2>关于我</h2>
        <div class="about-card">
            <p>热爱编程、喜欢折腾开源项目，使用 GitHub Pages 搭建个人静态网站。</p>
            <p>擅长：HTML / CSS / JavaScript，持续学习中。</p>
        </div>
    </section>

    <!-- 项目展示 -->
    <section id="project" class="section bg-gray">
        <h2>我的项目</h2>
        <div class="project-list">
            <div class="project-card">
                <h3>个人静态博客</h3>
                <p>Github Pages 极简博客模板</p>
                <a href="https://github.com/你的用户名" target="_blank">查看仓库</a>
            </div>
            <div class="project-card">
                <h3>工具小脚本</h3>
                <p>常用前端、自动化小工具合集</p>
                <a href="https://github.com/你的用户名" target="_blank">查看仓库</a>
            </div>
        </div>
    </section>

    <!-- 联系方式 -->
    <section id="contact" class="section">
        <h2>联系我</h2>
        <div class="contact-info">
            <p>GitHub：<a href="https://github.com/你的用户名" target="_blank">github.com/你的用户名</a></p>
            <p>邮箱：example@xxx.com</p>
        </div>
    </section>

    <!-- 页脚 -->
    <footer>
        <p>© 2026 个人主页 | Powered by GitHub Pages</p>
    </footer>

    <!-- 引入JS -->
    <script src="./script.js"></script>
</body>
</html>
